<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Thymira</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/thread.css">
  <link rel="stylesheet" href="/static/css/panels.css">
  <link rel="stylesheet" href="/static/css/motion.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <div class="shell" id="shell" data-sidebar="open" data-inspector="closed">
    <nav class="sidebar" id="sidebar" aria-label="Threads"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main" id="main"></main>
    <aside class="inspector" id="inspector" aria-label="Inspector" hidden></aside>
  </div>
  <div class="banner" id="banner" hidden role="status"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="palette-host" id="palette" hidden></div>
  <dialog class="dialog connect" id="connect" aria-labelledby="connect-title">
    <form id="connect-form">
      <h2 id="connect-title">Connect to the Thymira API</h2>
      <p>Requests go to the API with the token you paste here. It is kept in this browser tab only and
        is gone when the tab closes.</p>
      <label for="token">API token</label>
      <input class="input" id="token" name="token" type="password" autocomplete="off" spellcheck="false">
      <p class="connect-hint">The API prints where it wrote its token when it starts; by default
        <code>&lt;workspace&gt;/.thymira/runtime/api-token</code>.</p>
      <p class="connect-error" id="connect-error" hidden></p>
      <div class="connect-actions">
        <button class="btn" type="button" id="connect-cancel">Not now</button>
        <button class="btn btn-primary" type="submit">Connect</button>
      </div>
    </form>
  </dialog>
  <dialog class="dialog" id="confirm" aria-labelledby="confirm-title"></dialog>
</body>
</html>
